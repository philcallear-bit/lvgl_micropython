name: Build Pico W LVGL v9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Revert to Stable RP2 Commit
        run: |
          git checkout $(git rev-list -n 1 --before="2024-04-01" main)
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Fix make.py Syntax Bug
        run: |
          python3 -c "
          import re
          with open('make.py', 'r') as f:
              s = f.read()
          s = re.sub(r'([\"\']rp2[\"\'])\s+([\"\']renesas-ra[\"\'])', r'\1, \2', s)
          with open('make.py', 'w') as f:
              f.write(s)
          "
          python3 make.py --help

      - name: Install ARM Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build python3

      - name: Precompile mpy-cross
        run: |
          # Build host mpy-cross cleanly so CMake doesn't choke on frozen qstr linking
          cd lib/micropython/mpy-cross
          make clean
          make -j$(nproc)

      - name: Run Build
        run: |
          python3 make.py rp2 BOARD=RPI_PICO_W

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-w-lvgl9-firmware
          path: |
            build/*.uf2
            lib/micropython/ports/rp2/build*/**/*.uf2
