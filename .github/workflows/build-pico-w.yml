name: Build Pico W LVGL v9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Revert to Stable RP2 Commit
        run: |
          git checkout $(git rev-list -n 1 --before="2024-04-01" main)
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Fix make.py Syntax Bug
        run: |
          python3 -c "
          import re
          with open('make.py', 'r') as f:
              s = f.read()
          s = re.sub(r'([\"\']rp2[\"\'])\s+([\"\']renesas-ra[\"\'])', r'\1, \2', s)
          with open('make.py', 'w') as f:
              f.write(s)
          "
          python3 make.py --help

      - name: Fix lcd_types.c Syntax Errors
        run: |
          python3 -c "
          p = 'ext_mod/lcd_bus/lcd_types.c'
          with open(p, 'r') as f:
              code = f.read()
          code = code.replace('return io->tx_param(io, lcd_cmd, param, param_size);', 'return self->panel_io_handle.tx_param(obj, lcd_cmd, param, param_size);')
          bad_call = 'return self->panel_io_handle.tx_color(obj, lcd_cmd, color, color_size, int x_start, int y_start, int x_end, int y_end);'
          good_call = 'return self->panel_io_handle.tx_color(obj, lcd_cmd, color, color_size, x_start, y_start, x_end, y_end);'
          code = code.replace(bad_call, good_call)
          with open(p, 'w') as f:
              f.write(code)
          "

      - name: Install ARM Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build python3

      - name: Precompile mpy-cross
        run: |
          cd lib/micropython/mpy-cross
          make clean
          make -j$(nproc)

      - name: Configure LVGL Memory Pool
        run: |
          python3 -c "
          import os, glob, re

          # 1. Patch every lv_conf*.h file anywhere in the repo
          for p in set(glob.glob('**/*lv_conf*.h', recursive=True)):
              if os.path.isfile(p):
                  with open(p, 'r') as f:
                      txt = f.read()
                  txt = re.sub(r'#\s*define\s+LV_MEM_CUSTOM\s+1', '#define LV_MEM_CUSTOM 0', txt)
                  txt = re.sub(r'#\s*define\s+LV_MEM_SIZE\s+.*', '#define LV_MEM_SIZE (32 * 1024U)', txt)
                  with open(p, 'w') as f:
                      f.write(txt)
                  print(f'Patched header: {p}')

          # 2. Patch CMakeLists.txt and cmake files that pass -DLV_MEM_CUSTOM=1
          for p in set(glob.glob('**/*.cmake', recursive=True) + glob.glob('**/CMakeLists.txt', recursive=True)):
              if os.path.isfile(p):
                  with open(p, 'r') as f:
                      txt = f.read()
                  if 'LV_MEM_CUSTOM' in txt:
                      txt = re.sub(r'-DLV_MEM_CUSTOM=1', '-DLV_MEM_CUSTOM=0', txt)
                      txt = re.sub(r'LV_MEM_CUSTOM\s+1', 'LV_MEM_CUSTOM 0', txt)
                      with open(p, 'w') as f:
                          f.write(txt)
                      print(f'Patched cmake: {p}')

          # 3. Patch make.py if it defines or overrides LV_MEM_CUSTOM
          if os.path.isfile('make.py'):
              with open('make.py', 'r') as f:
                  txt = f.read()
              if 'LV_MEM_CUSTOM' in txt:
                  txt = re.sub(r'LV_MEM_CUSTOM=1', 'LV_MEM_CUSTOM=0', txt)
                  with open('make.py', 'w') as f:
                      f.write(txt)
                  print('Patched make.py')
          "

      - name: Run Build
        run: |
          python3 make.py rp2 BOARD=RPI_PICO_W CFLAGS_EXTRA="-DLV_MEM_CUSTOM=0 -DLV_MEM_SIZE=36864"

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-w-lvgl9-firmware
          path: |
            build/*.uf2
            lib/micropython/ports/rp2/build*/**/*.uf2
