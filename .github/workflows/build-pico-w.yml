name: Build Pico W LVGL v9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Revert to Stable RP2 Commit
        run: |
          git checkout $(git rev-list -n 1 --before="2024-04-01" main)
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Fix make.py Syntax Bug
        run: |
          # Fix the missing comma between 'rp2' and 'renesas-ra' in make.py
          python3 -c "
          with open('make.py', 'r') as f:
              content = f.read()
          content = content.replace('rp2renesas-ra', \"'rp2', 'renesas-ra'\")
          with open('make.py', 'w') as f:
              f.write(content)
          "

      - name: Install ARM Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build python3

      - name: Run Build
        run: |
          python3 make.py rp2 BOARD=RPI_PICO_W

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-w-lvgl9-firmware
          path: build/*.uf2
