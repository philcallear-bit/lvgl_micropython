name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3 \
            python3-venv \
            python3-pip \
            python3-pycparser \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            doxygen

      - name: Verify generator script exists
        run: ls -la gen/_api_gen_mpy.py

      - name: Build RPI_PICO2_W firmware
        run: python3 make.py rp2 BOARD=RPI_PICO2_W DISPLAY=ili9341 INDEV=xpt2046

      - name: Upload firmware.uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2w-lvgl9-v2-firmware
          path: build/lvgl_micropy_RPI_PICO2_W-*.uf2
