name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream lvgl_micropython
        uses: actions/checkout@v4
        with:
          repository: lvgl-micropython/lvgl_micropython
          ref: main

      - name: Align RP2 SPI definitions across rp2 and lcd_bus
        run: |
          sed -i \
            -e 's/machine_hw_spi_obj_t/mp_machine_hw_spi_device_obj_t/g' \
            -e 's/\.mosi/.data0/g' \
            -e 's/->mosi/->data0/g' \
            -e 's/\.miso/.data1/g' \
            -e 's/->miso/->data1/g' \
            -e 's/\.active_devices/.device_count/g' \
            -e 's/->active_devices/->device_count/g' \
            -e 's/self->baudrate/self->freq/g' \
            micropy_updates/rp2/machine_spi.c
          sed -i \
            -e 's/->mosi/->data0/g' \
            -e 's/->miso/->data1/g' \
            ext_mod/lcd_bus/common_src/spi_bus.c
          sed -i 's|#endif /\* __MP_SPI_COMMON_H__ \*/|    typedef mp_machine_hw_spi_device_obj_t machine_hw_spi_device_obj_t;\n    extern const mp_obj_type_t machine_spi_type;\n#endif /* __MP_SPI_COMMON_H__ */|' \
            micropy_updates/common/mp_spi_common.h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3 \
            python3-venv \
            python3-pip \
            python3-pycparser \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            doxygen

      - name: Build RPI_PICO2_W firmware
        env:
          GEN_SCRIPT: python
        run: python3 make.py rp2 BOARD=RPI_PICO2_W DISPLAY=ili9341 INDEV=xpt2046

      - name: Upload firmware.uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2w-lvgl9-v2-firmware
          path: build/lvgl_micropy_RPI_PICO2_W.uf2
