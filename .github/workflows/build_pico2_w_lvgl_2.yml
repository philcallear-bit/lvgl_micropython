name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3 \
            python3-venv \
            python3-pip \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            doxygen

      - name: Clone lvgl_micropython
        run: |
          git clone https://github.com/lvgl-micropython/lvgl_micropython.git
          cd lvgl_micropython

      - name: Build RPI_PICO2_W firmware with ILI9341 and XPT2046
        working-directory: ./lvgl_micropython
        run: |
          python3 make.py rp2 \
            BOARD=RPI_PICO2_W \
            DISPLAY=ili9341 \
            INDEV=xpt2046

      - name: Upload firmware.uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2w-lvgl9-v2-firmware
          path: lvgl_micropython/build/lvgl_micropy_RPI_PICO2_W-*.uf2
