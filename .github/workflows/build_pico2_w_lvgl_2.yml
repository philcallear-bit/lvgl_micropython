name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream lvgl_micropython
        uses: actions/checkout@v4
        with:
          repository: lvgl-micropython/lvgl_micropython
          ref: main
          fetch-depth: 30

      - name: Check tags and recent commits
        run: |
          git tag --sort=-creatordate | head -n 15
          git log -n 15 --oneline
          git log -n 5 --oneline -- micropy_updates/rp2/ lib/micropython
