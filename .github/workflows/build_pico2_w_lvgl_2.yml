name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream lvgl_micropython
        uses: actions/checkout@v4
        with:
          repository: lvgl-micropython/lvgl_micropython
          ref: main

      - name: Inspect gen directory and upstream workflows
        run: |
          ls -la gen/
          ls -la .github/workflows/
          cat ext_mod/lvgl/micropython.cmake
          head -n 60 .github/workflows/*.yml
