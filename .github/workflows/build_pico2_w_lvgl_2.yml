name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream lvgl_micropython
        uses: actions/checkout@v4
        with:
          repository: lvgl-micropython/lvgl_micropython
          ref: main

      - name: Inspect machine_spi.h vs micropy_updates/rp2/machine_spi.c
        run: |
          git submodule update --init lib/micropython
          ls -la micropy_updates/rp2/
          head -n 45 micropy_updates/rp2/machine_spi.c
          cat lib/micropython/extmod/machine_spi.h
