name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream lvgl_micropython
        uses: actions/checkout@v4
        with:
          repository: lvgl-micropython/lvgl_micropython
          ref: main

      - name: Inspect mp_spi_common.h and references
        run: |
          cat micropy_updates/common/mp_spi_common.h
          grep -rn "mp_spi_common\|micropy_updates" make.py builder/ micropy_updates/
