name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream lvgl_micropython
        uses: actions/checkout@v4
        with:
          repository: lvgl-micropython/lvgl_micropython
          ref: main
          fetch-depth: 0

      - name: Inspect mp_spi_common.h history and rp2 machine_spi.c
        run: |
          git log -n 10 --oneline -- micropy_updates/common/mp_spi_common.h micropy_updates/rp2/machine_spi.c
          cat micropy_updates/rp2/machine_spi.c
