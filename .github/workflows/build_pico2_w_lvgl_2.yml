name: Build Pico 2 W LVGL v9 UF2 (v2)

on:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream lvgl_micropython
        uses: actions/checkout@v4
        with:
          repository: lvgl-micropython/lvgl_micropython
          ref: main

      - name: Inspect make.py rp2 options and GEN_SCRIPT
        run: |
          python3 make.py rp2 --help || true
          grep -rn "GEN_SCRIPT" make.py builder/ ext_mod/ || true
          cat builder/rp2.py || true
