name: Build Pico 2 W LVGL v9 (A)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Revert to Stable RP2 Commit
        run: |
          git checkout $(git rev-list -n 1 --before="2024-04-01" main)
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Upgrade Pico SDK to 2.1.0 for RP2350 Support
        run: |
          cd lib/micropython/lib/pico-sdk
          git fetch --tags
          git checkout 2.1.0
          git submodule update --init --recursive
          cd ../../../..

      - name: Fetch Official RPI_PICO2_W Board Definition
        run: |
          mkdir -p lib/micropython/ports/rp2/boards/RPI_PICO2_W
          cd lib/micropython/ports/rp2/boards/RPI_PICO2_W
          curl -sSL -O https://raw.githubusercontent.com/micropython/micropython/master/ports/rp2/boards/RPI_PICO2_W/mpconfigboard.h
          curl -sSL -O https://raw.githubusercontent.com/micropython/micropython/master/ports/rp2/boards/RPI_PICO2_W/mpconfigboard.cmake
          curl -sSL -O https://raw.githubusercontent.com/micropython/micropython/master/ports/rp2/boards/RPI_PICO2_W/pins.csv
          cd ../../../../../

      - name: Install Toolchain and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build python3 libusb-1.0-0-dev

      - name: Build and Install Host SDK Tools (picotool & pioasm)
        run: |
          # 1. Build and install picotool
          git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/picotool.git /tmp/picotool
          cmake -B /tmp/picotool/build -S /tmp/picotool -DPICO_SDK_PATH=$PWD/lib/micropython/lib/pico-sdk
          cmake --build /tmp/picotool/build -j$(nproc)
          sudo cmake --install /tmp/picotool/build
          picotool version

          # 2. Build and install pioasm
          cmake -B /tmp/pioasm/build -S lib/micropython/lib/pico-sdk/tools/pioasm
          cmake --build /tmp/pioasm/build -j$(nproc)
          sudo install -m 755 /tmp/pioasm/build/pioasm /usr/local/bin/pioasm
          which pioasm

      - name: Patch RP2 CMakeLists for Pico SDK 2.x and Precompiled Tools
        run: |
          cat << 'EOF' > patch_cmake.py
          p = 'lib/micropython/ports/rp2/CMakeLists.txt'
          with open(p, 'r') as f:
              lines = f.readlines()
          
          # 1. Strip deprecated float/double ROM shims for Pico SDK 2.x
          new_lines = []
          for line in lines:
              if any(k in line for k in ['float_aeabi.S', 'float_init_rom.c', 'float_math.c', 'float_v1_rom_shim.S',
                                         'double_aeabi.S', 'double_init_rom.c', 'double_math.c', 'double_v1_rom_shim.S']):
                  continue
              new_lines.append(line)
          
          # 2. Prepend imported executable targets for picotool and pioasm at the top of CMakeLists.txt
          header = (
              'if(NOT TARGET pioasm)\n'
              '    add_executable(pioasm IMPORTED GLOBAL)\n'
              '    set_target_properties(pioasm PROPERTIES IMPORTED_LOCATION "/usr/local/bin/pioasm")\n'
              '    set(PIOASM_EXECUTABLE "/usr/local/bin/pioasm" CACHE FILEPATH "Precompiled pioasm" FORCE)\n'
              'endif()\n'
              'if(NOT TARGET picotool)\n'
              '    add_executable(picotool IMPORTED GLOBAL)\n'
              '    set_target_properties(picotool PROPERTIES IMPORTED_LOCATION "/usr/local/bin/picotool")\n'
              '    set(PICOTOOL_EXECUTABLE "/usr/local/bin/picotool" CACHE FILEPATH "Precompiled picotool" FORCE)\n'
              'endif()\n'
          )
          
          with open(p, 'w') as f:
              f.write(header + ''.join(new_lines))
          EOF
          python3 patch_cmake.py

      - name: Fix make.py Syntax Bug
        run: |
          cat << 'EOF' > patch_make.py
          import re

          with open('make.py', 'r') as f:
              code = f.read()

          code = re.sub(r"(['\"])rp2\1\s*(['\"])renesas-ra\2", r"\1rp2\1, \2renesas-ra\2", code)

          with open('make.py', 'w') as f:
              f.write(code)
          EOF
          python3 patch_make.py
          python3 make.py --help

      - name: Fix lcd_types.c Syntax Errors
        run: |
          cat << 'EOF' > patch_lcd.py
          p = 'ext_mod/lcd_bus/lcd_types.c'
          with open(p, 'r') as f:
              code = f.read()
          code = code.replace('return io->tx_param(io, lcd_cmd, param, param_size);', 'return self->panel_io_handle.tx_param(obj, lcd_cmd, param, param_size);')
          bad_call = 'return self->panel_io_handle.tx_color(obj, lcd_cmd, color, color_size, int x_start, int y_start, int x_end, int y_end);'
          good_call = 'return self->panel_io_handle.tx_color(obj, lcd_cmd, color, color_size, x_start, y_start, x_end, y_end);'
          code = code.replace(bad_call, good_call)
          with open(p, 'w') as f:
              f.write(code)
          EOF
          python3 patch_lcd.py

      - name: Precompile mpy-cross
        run: |
          cd lib/micropython/mpy-cross
          make clean
          make -j$(nproc)

      - name: Configure LVGL Memory Pool
        run: |
          echo "Using standard MicroPython GC memory management (LV_MEM_CUSTOM 1)"

      - name: Run Build
        run: |
          python3 make.py rp2 BOARD=RPI_PICO2_W

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2-w-lvgl9-firmware
          path: |
            build*/**/*.uf2
            lib/micropython/ports/rp2/build*/**/*.uf2
