name: Build Pico 2 W LVGL v9 (B)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Update MicroPython to Master for Native RP2350 & Pico 2 W Support
        run: |
          cd lib/micropython
          git fetch origin master
          git checkout origin/master
          git submodule update --init lib/pico-sdk lib/cyw43-driver lib/lwip lib/mbedtls lib/btstack lib/micropython-lib || true
          git submodule init lib/tinyusb
          cd lib/tinyusb
          git config remote.origin.promisor false
          git fetch --unshallow || git fetch --all --tags
          cd ../..
          git submodule update --init lib/tinyusb
          cd ../..

      - name: Upgrade Pico SDK to 2.1.0 for RP2350 Support
        run: |
          cd lib/micropython/lib/pico-sdk
          git fetch --tags
          git checkout 2.1.0
          git submodule init lib/tinyusb || true
          if [ -d "lib/tinyusb" ]; then
            cd lib/tinyusb
            git fetch --unshallow || git fetch --all --tags || true
            cd ../..
          fi
          git submodule update --init --recursive || true
          cd ../../../..

      - name: Install Toolchain and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build python3 libusb-1.0-0-dev python3-pycparser

      - name: Build and Install Host SDK Tools (picotool & pioasm)
        run: |
          git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/picotool.git /tmp/picotool
          cmake -B /tmp/picotool/build -S /tmp/picotool -DPICO_SDK_PATH=$PWD/lib/micropython/lib/pico-sdk
          cmake --build /tmp/picotool/build -j$(nproc)
          sudo cmake --install /tmp/picotool/build
          picotool version

          cmake -B /tmp/pioasm/build -S lib/micropython/lib/pico-sdk/tools/pioasm
          cmake --build /tmp/pioasm/build -j$(nproc)
          sudo install -m 755 /tmp/pioasm/build/pioasm /usr/local/bin/pioasm
          which pioasm

      - name: Apply Source Code and Build Script Patches
        run: |
          cat << 'EOF' > apply_patches.py
          import os, re

          # 1. Patch lcd_types.c
          p = 'ext_mod/lcd_bus/lcd_types.c'
          if os.path.exists(p):
              with open(p, 'r') as f:
                  code = f.read()
              code = code.replace('return io->tx_param(io, lcd_cmd, param, param_size);', 'return self->panel_io_handle.tx_param(obj, lcd_cmd, param, param_size);')
              bad_call = 'return self->panel_io_handle.tx_color(obj, lcd_cmd, color, color_size, int x_start, int y_start, int x_end, int y_end);'
              good_call = 'return self->panel_io_handle.tx_color(obj, lcd_cmd, color, color_size, x_start, y_start, x_end, y_end);'
              code = code.replace(bad_call, good_call)
              with open(p, 'w') as f:
                  f.write(code)
              print('Patched lcd_types.c')

          # 2. Patch spi_bus.h
          spi_h = 'ext_mod/lcd_bus/common_include/spi_bus.h'
          if os.path.exists(spi_h):
              with open(spi_h, 'r') as f:
                  h_code = f.read()
              h_code = re.sub(r'machine_hw_spi_device_obj_t\s*\*spi_bus;', 'mp_obj_base_t *spi_bus;', h_code)
              with open(spi_h, 'w') as f:
                  f.write(h_code)
              print('Patched spi_bus.h')

          # 3. Patch spi_bus.c
          spi_c = 'ext_mod/lcd_bus/common_src/spi_bus.c'
          if os.path.exists(spi_c):
              with open(spi_c, 'r') as f:
                  c_code = f.read()
              c_code = re.sub(
                  r'self->spi_bus\s*=\s*\(machine_hw_spi_device_obj_t\s*\*\)MP_OBJ_TO_PTR\(args\[ARG_spi_bus\]\.u_obj\);',
                  'self->spi_bus = (mp_obj_base_t *)MP_OBJ_TO_PTR(args[ARG_spi_bus].u_obj);',
                  c_code
              )
              c_code = re.sub(
                  r'self->host\s*=\s*\(int\)self->spi_bus->spi_bus->host;',
                  'self->host = 0;',
                  c_code
              )
              old_marker = 'mp_obj_base_t *spi;'
              if old_marker in c_code:
                  parts = c_code.split(old_marker)
                  rest_parts = parts[1].split('return LCD_OK;', 1)
                  new_block = '\n        mp_obj_base_t *spi = self->spi_bus;\n        self->bus_handle = spi;\n        self->panel_io_config.spi_transfer = ((mp_machine_spi_p_t *)MP_OBJ_TYPE_GET_SLOT(spi->type, protocol))->transfer;\n'
                  c_code = parts[0] + new_block + '\n        return LCD_OK;' + rest_parts[1]
                  with open(spi_c, 'w') as f:
                      f.write(c_code)
                  print('Patched spi_bus.c')

          # 4. Patch stub_gen in lvgl_api_gen_mpy.py
          gen_path = 'gen/lvgl_api_gen_mpy.py'
          if os.path.exists(gen_path):
              with open(gen_path, 'r') as f:
                  g_code = f.read()
              old_stub = 'stub_gen.run(args.metadata)'
              safe_stub = 'try:\n        stub_gen.run(args.metadata, args.metadata)\n    except Exception:\n        pass'
              if old_stub in g_code:
                  g_code = g_code.replace(old_stub, safe_stub)
                  with open(gen_path, 'w') as f:
                      f.write(g_code)
                  print('Patched stub_gen in lvgl_api_gen_mpy.py')

          # 5. Patch ext_mod/lvgl/micropython.cmake
          cmake_file = 'ext_mod/lvgl/micropython.cmake'
          if os.path.exists(cmake_file):
              with open(cmake_file, 'r') as f:
                  cm_code = f.read()
              cm_code = cm_code.replace('if(${SECOND_BUILD_ENV} EQUAL "0")', 'if("${SECOND_BUILD_ENV}" STREQUAL "0" OR NOT SECOND_BUILD_ENV)')
              cm_code = cm_code.replace('if(${mpy_result} GREATER "0")', 'if("${mpy_result}" STREQUAL "" OR NOT "${mpy_result}" STREQUAL "0")')
              cm_code = re.sub(r'--header_file=\$\{LVGL_DIR\}/lvgl\.h', '${BINDING_DIR}/lib/lvgl/lvgl.h', cm_code)
              cm_code = cm_code.replace('--include=', '-I ')
              with open(cmake_file, 'w') as f:
                  f.write(cm_code)
              print('Patched ext_mod/lvgl/micropython.cmake')

          # 6. Patch CMakeLists.txt linker override
          rp2_cmake = 'lib/micropython/ports/rp2/CMakeLists.txt'
          if os.path.exists(rp2_cmake):
              with open(rp2_cmake, 'r') as f:
                  content = f.read()
              shim = '\nif(NOT COMMAND pico_add_linker_script_override_path)\n    macro(pico_add_linker_script_override_path TARGET PATH)\n        pico_set_linker_script(${TARGET} ${PATH})\n    endmacro()\nendif()\n'
              if 'pico_add_linker_script_override_path' not in content[:300]:
                  content = shim + '\n' + content
                  with open(rp2_cmake, 'w') as f:
                      f.write(content)
                  print('Injected linker script shim')

          # 7. Patch clocks_extra.c for RP2350
          clocks_src = 'lib/micropython/ports/rp2/clocks_extra.c'
          if os.path.exists(clocks_src):
              with open(clocks_src, 'r') as f:
                  c_code = f.read()
              if 'RTC_CLOCK_FREQ_HZ' not in c_code[:200]:
                  c_code = '#ifndef RTC_CLOCK_FREQ_HZ\n#define RTC_CLOCK_FREQ_HZ (46875u)\n#endif\n' + c_code
                  with open(clocks_src, 'w') as f:
                      f.write(c_code)
                  print('Injected RTC_CLOCK_FREQ_HZ into clocks_extra.c')
          EOF
          python3 apply_patches.py

      - name: Precompile mpy-cross
        run: |
          cd lib/micropython/mpy-cross
          make clean
          make -j$(nproc)

      - name: Run Build Direct with Ninja
        env:
          GEN_SCRIPT: lvgl
          LV_PORT: rp2
          SECOND_BUILD_ENV: "0"
        run: |
          cd lib/micropython/ports/rp2

          USER_C_MODS_ARG=""
          if [ -f "$GITHUB_WORKSPACE/ext_mod/micropython.cmake" ]; then
            USER_C_MODS_ARG="-DUSER_C_MODULES=$GITHUB_WORKSPACE/ext_mod/micropython.cmake"
          elif [ -f "$GITHUB_WORKSPACE/micropython.cmake" ]; then
            USER_C_MODS_ARG="-DUSER_C_MODULES=$GITHUB_WORKSPACE/micropython.cmake"
          fi

          cmake -B build-RPI_PICO2_W -S . -G Ninja \
            -DPICO_PLATFORM=rp2350-arm-s \
            -DPICO_BOARD=pico2_w \
            -DBOARD=RPI_PICO2_W \
            -DPICO_SDK_PATH=$PWD/../../lib/pico-sdk \
            $USER_C_MODS_ARG

          ninja -C build-RPI_PICO2_W

          if [ ! -f build-RPI_PICO2_W/firmware.uf2 ] && [ -f build-RPI_PICO2_W/firmware.elf ]; then
            /usr/local/bin/picotool uf2 convert build-RPI_PICO2_W/firmware.elf build-RPI_PICO2_W/firmware.uf2 --family rp2350-arm-s
          fi

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2-w-lvgl9-firmware
          path: |
            lib/micropython/ports/rp2/build*/**/*.uf2
            lib/micropython/ports/rp2/build*/*.uf2
